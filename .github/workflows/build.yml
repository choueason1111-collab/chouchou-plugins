# Builds every chouchou plugin for Windows and Mac on GitHub's machines.
# - Each push: the zips appear under the run's "Artifacts" (Actions tab).
# - Pushing a tag such as v1.0.0: the zips are also published on the Releases page,
#   which is the link to give to people.
name: Build plugins

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  JUCE_VERSION: "9.0.0"
  ARA_SDK_VERSION: "releases/2.3.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE and the ARA SDK
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git _deps/JUCE
          git clone --depth 1 --branch "$ARA_SDK_VERSION" --recurse-submodules --shallow-submodules \
              https://github.com/Celemony/ARA_SDK.git _deps/ARA_SDK

      - name: Configure
        run: |
          # pwd -W gives a Windows path (C:/...) under Git Bash; plain pwd on Mac.
          DEPS="$(pwd -W 2>/dev/null || pwd)/_deps"
          EXTRA=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCHOUCHOU_JUCE_DIR="$DEPS/JUCE" \
              -DCHOUCHOU_ARA_SDK_DIR="$DEPS/ARA_SDK" \
              -DCHOUCHOU_COPY_AFTER_BUILD=OFF \
              "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        run: |
          OUT="dist/chouchou-plugins-${{ matrix.name }}"
          mkdir -p "$OUT/VST3" "$OUT/Standalone"
          cp LICENSE THIRD_PARTY_NOTICES.md "$OUT/"
          find build -type d -path '*_artefacts/Release/VST3/*.vst3' -prune -exec cp -R {} "$OUT/VST3/" \;
          if [ "$RUNNER_OS" = "Windows" ]; then
            find build -type f -path '*_artefacts/Release/Standalone/*.exe' -exec cp {} "$OUT/Standalone/" \;
            cp packaging/INSTALL_Windows.txt "$OUT/INSTALL.txt"
            (cd dist && 7z a "../chouchou-plugins-${{ matrix.name }}.zip" "chouchou-plugins-${{ matrix.name }}")
          else
            mkdir -p "$OUT/AU"
            find build -type d -path '*_artefacts/Release/AU/*.component' -prune -exec cp -R {} "$OUT/AU/" \;
            find build -type d -path '*_artefacts/Release/Standalone/*.app' -prune -exec cp -R {} "$OUT/Standalone/" \;
            cp packaging/INSTALL_macOS.txt "$OUT/INSTALL.txt"
            # ditto keeps the bundles' executable permissions, which a plain zip upload would lose.
            ditto -c -k --keepParent "$OUT" "chouchou-plugins-${{ matrix.name }}.zip"
          fi
          ls -R dist | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: chouchou-plugins-${{ matrix.name }}
          path: chouchou-plugins-${{ matrix.name }}.zip

      - name: Publish on the Releases page (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chouchou-plugins-${{ matrix.name }}.zip
